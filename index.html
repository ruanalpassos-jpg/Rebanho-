<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meu Rebanho</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#2f6b3f">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark;
--bg:#f5f6f1;--sf:#fff;--ink:#1c2a20;--mut:#66726a;--ln:#d9ddd2;--vaca:#2f6b3f;--touro:#34506e;--tag:#f2c230;--tagink:#3a2f00;--bad:#a23b2a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a15;--sf:#1b261f;--ink:#e8eee9;--mut:#9aa89f;--ln:#2d3b32;--vaca:#6fc183;--touro:#8fb2d6;--tag:#e0b52a;--tagink:#2b2200;--bad:#e58a78}}
:root[data-theme="dark"]{--bg:#121a15;--sf:#1b261f;--ink:#e8eee9;--mut:#9aa89f;--ln:#2d3b32;--vaca:#6fc183;--touro:#8fb2d6;--tag:#e0b52a;--tagink:#2b2200;--bad:#e58a78}
html{height:100%}*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;max-width:640px;margin:0 auto;padding:12px 14px 40px}
h1{font:700 22px/1.2 Georgia,"Times New Roman",serif;margin:6px 0 10px}
h2{font:700 17px/1.2 Georgia,serif;margin:18px 0 8px}
nav{display:flex;gap:6px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding:6px 0;z-index:5}
nav button{flex:1;padding:10px 4px;border:1px solid var(--ln);background:var(--sf);color:var(--ink);border-radius:10px;font:600 14px system-ui,sans-serif}
nav button.on{background:var(--vaca);color:#fff;border-color:var(--vaca)}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:12px;margin:10px 0}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 3px}
input,select,textarea{width:100%;padding:10px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{padding:11px 14px;border:0;border-radius:10px;background:var(--vaca);color:#fff;font:600 15px system-ui,sans-serif;margin-top:12px}
.btn.alt{background:transparent;color:var(--ink);border:1px solid var(--ln)}
.btn.bad{background:transparent;color:var(--bad);border:1px solid var(--bad)}
.tag{display:inline-block;background:var(--tag);color:var(--tagink);font-weight:700;padding:1px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.it:last-child{border:0}
.F{color:var(--vaca)}.M{color:var(--touro)}.mut{color:var(--mut);font-size:14px}
.tree,.tree ul{list-style:none;margin:0;padding-left:16px;border-left:2px solid var(--ln)}
.tree{padding-left:0;border:0}
.tree li{margin:6px 0}.tree .x{color:var(--mut);font-style:italic}
.sc{overflow-x:auto}table{border-collapse:collapse;width:100%}td,th{padding:8px 6px;border-bottom:1px solid var(--ln);text-align:left;font-size:15px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
.big{font:700 28px Georgia,serif}
.empty{color:var(--mut);padding:14px 0}
.anim{margin:6px 0 4px}.anim svg{width:100%;height:auto;max-height:250px;display:block}
.ln{fill:none;stroke:#e0b52a;stroke-width:3;stroke-linecap:round;stroke-dasharray:100;stroke-dashoffset:100;animation:dw 1.2s ease forwards}.l2{animation-delay:.1s}@keyframes dw{to{stroke-dashoffset:0}}
.bp{fill:var(--touro);fill-opacity:.18;stroke:var(--touro);stroke-width:2}.bm{fill:var(--vaca);fill-opacity:.18;stroke:var(--vaca);stroke-width:2}
.bt{font:600 11px system-ui,sans-serif;fill:var(--ink)}.lb{font:12px system-ui,sans-serif;fill:var(--mut)}
.ft{font:700 12px system-ui,sans-serif;fill:#3a2f00;opacity:0;animation:fi .5s 1.6s forwards}@keyframes fi{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.ln{animation:none;stroke-dashoffset:0}.dr{display:none}.ft{animation:none;opacity:1}}
</style>
</head>
<body>
<h1>Meu Rebanho</h1>
<nav id="nav"></nav>
<main id="app"></main>
<script>
var pend=null,K='rebanho-v1',D={animais:[],leite:[]},tab='animais',sel=null,edit=null;
try{var s=localStorage.getItem(K);if(s)D=JSON.parse(s)}catch(e){}
function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function esc(t){return String(t==null?'':t).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function find(b){var k=String(b).trim().toLowerCase();return D.animais.filter(function(a){return a.b.toLowerCase()===k})[0]}
function hoje(){return new Date().toISOString().slice(0,10)}
function fdate(d){return d?d.split('-').reverse().join('/'):''}
function lbl(b){var a=find(b);return '<span class="tag">'+esc(b)+'</span>'}
function media(b){var r=D.leite.filter(function(x){return x.b===b});if(!r.length)return null;return r.reduce(function(s,x){return s+x.l},0)/r.length}
function fmt(n){return n==null?'–':n.toFixed(1).replace('.',',')+' L'}
function nav(){var t=[['animais','Animais'],['leite','Leite'],['backup','Backup']];
 document.getElementById('nav').innerHTML=t.map(function(x){return '<button class="'+(tab===x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>'}).join('')}
function go(t){tab=t;sel=null;edit=null;pend=null;render()}
function ancs(b,d,role){var a=find(b),h='<li>'+(role?'<span class="mut">'+role+': </span>':'');
 if(!a){return h+'<span class="x">'+esc(b)+' (fora do cadastro)</span></li>'}
 h+='<span class="'+a.sexo+'">'+lbl(b)+'</span>';
 if(d>0&&(a.pai||a.mae)){h+='<ul>'+(a.pai?ancs(a.pai,d-1,'Pai'):'')+(a.mae?ancs(a.mae,d-1,'Mãe'):'')+'</ul>'}
 return h+'</li>'}
function desc(b,d,seen){var k=D.animais.filter(function(x){return String(x.mae).toLowerCase()===b.toLowerCase()||String(x.pai).toLowerCase()===b.toLowerCase()});if(!k.length||d<0)return '';
 return '<ul>'+k.map(function(x){var h='<li><span class="'+x.sexo+'">'+lbl(x.b)+'</span> <span class="mut">'+(x.sexo==='F'?'fêmea':'macho')+(x.nasc?' · '+fdate(x.nasc):'')+'</span>';
  if(d>0&&seen.indexOf(x.b)<0)h+=desc(x.b,d-1,seen.concat(b));return h+'</li>'}).join('')+'</ul>'}
function opts(sx){return D.animais.filter(function(a){return a.sexo===sx}).map(function(a){return '<option value="'+esc(a.b)+'">'+esc(a.nome||'')+'</option>'}).join('')}
function form(a){a=a||{b:'',nome:'',sexo:'F',nasc:'',mae:'',pai:'',obs:''};var ed=!!edit;
 return '<div class="card"><h2 style="margin-top:0">'+(ed?'Editar animal':'Novo animal')+'</h2>'+
 '<label>Nome do animal</label><input id="f_b" value="'+esc(a.b)+'" '+(ed?'readonly':'')+' autocomplete="off">'+
 ''+
 '<div class="row"><div><label>Sexo</label><select id="f_sexo"><option value="F"'+(a.sexo==='F'?' selected':'')+'>Fêmea</option><option value="M"'+(a.sexo==='M'?' selected':'')+'>Macho</option></select></div>'+
 '<div><label>Nascimento</label><input id="f_nasc" type="date" value="'+esc(a.nasc)+'"></div></div>'+
 '<label>Nome da mãe</label><input id="f_mae" list="dl_m" value="'+esc(a.mae)+'"><datalist id="dl_m">'+opts('F')+'</datalist>'+
 '<label>Nome do pai (touro ou sêmen)</label><input id="f_pai" list="dl_p" value="'+esc(a.pai)+'"><datalist id="dl_p">'+opts('M')+'</datalist>'+
 '<label>Observações</label><textarea id="f_obs" rows="2">'+esc(a.obs)+'</textarea>'+
 '<div id="err" class="mut" style="color:var(--bad)"></div>'+
 '<button class="btn" onclick="salvar()">Salvar animal</button>'+(ed?' <button class="btn alt" onclick="edit=null;render()">Cancelar</button>':'')+'</div>'}
function salvar(){var v=function(i){return document.getElementById(i).value.trim()},b=v('f_b');
 if(!b){document.getElementById('err').textContent='Informe o nome do animal.';return}
 var a={b:b,nome:'',sexo:v('f_sexo'),nasc:v('f_nasc'),mae:v('f_mae'),pai:v('f_pai'),obs:v('f_obs')};
 if(a.mae===b||a.pai===b){document.getElementById('err').textContent='O animal não pode ser pai ou mãe de si mesmo.';return}
 var i=D.animais.map(function(x){return x.b}).indexOf(b);
 if(edit){D.animais[i]=a}else{if(i>=0){document.getElementById('err').textContent='Já existe um animal com o nome '+b+'.';return}D.animais.push(a)}
 save();sel=b;edit=null;render()}
function anim(b){var a=find(b);if(!a||!(a.pai||a.mae))return '';var nm=function(s){s=String(s||'');return s.length>11?s.slice(0,10)+'…':s},P=a.pai?nm(a.pai):'?',M=a.mae?nm(a.mae):'?',C=nm(b),A='M70 78 Q70 112 160 112 L160 132',B='M250 78 Q250 112 160 112 L160 132';
return `<div class="anim"><svg viewBox="0 0 320 200" role="img" aria-label="Pai e mãe se ligam e dão origem a ${esc(b)}"><defs><radialGradient id="gg" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#fff3b0"/><stop offset=".55" stop-color="#f2c230"/><stop offset="1" stop-color="#b8860b"/></radialGradient></defs><path class="ln" pathLength="100" d="${A}"/><path class="ln l2" pathLength="100" d="${B}"/><circle class="bp" cx="70" cy="50" r="28"/><circle class="bm" cx="250" cy="50" r="28"/><text class="bt" x="70" y="54" text-anchor="middle">${esc(P)}</text><text class="bt" x="250" y="54" text-anchor="middle">${esc(M)}</text><circle cx="160" cy="160" r="0" fill="url(#gg)"><animate attributeName="r" values="0;30" dur=".6s" begin="1.2s" fill="freeze"/></circle><text class="ft" x="160" y="164" text-anchor="middle">${esc(C)}</text></svg></div>`}
function detalhe(b){var a=find(b);if(!a){sel=null;return render()}var m=media(b);
 var h='<div class="card"><button class="btn alt" style="margin:0 0 10px" onclick="pend=null;sel=null;render()">Voltar</button>'+
 '<div class="big '+a.sexo+'">'+esc(a.b)+'</div><div>'+esc(a.nome||'')+' <span class="mut">'+(a.sexo==='F'?'Fêmea':'Macho')+(a.nasc?' · nasceu em '+fdate(a.nasc):'')+'</span></div>'+
 (a.obs?'<p class="mut">'+esc(a.obs)+'</p>':'')+(a.sexo==='F'?'<p>Média de leite: <b>'+fmt(m)+'</b> por ordenha registrada</p>':'')+
 anim(b)+'<h2>Antepassados</h2>'+((a.pai||a.mae)?'<ul class="tree">'+ancs(b,3).replace(/^<li>/,'<li>')+'</ul>':'<div class="empty">Pai e mãe não informados.</div>')+
 '<h2>Descendentes</h2>'+(desc(b,3,[])?'<div class="tree">'+desc(b,3,[])+'</div>':'<div class="empty">Nenhum filho cadastrado.</div>')+
 '<button class="btn" onclick="edit=find(\''+esc(b).replace(/\\/g,'\\\\').replace(/\'/g,"\\'")+'\');sel=null;render()">Editar</button> '+
 '<button class="btn bad" onclick="apagar(\''+esc(b).replace(/\\/g,'\\\\').replace(/\'/g,"\\'")+'\')">'+(pend===b?'Toque de novo para confirmar':'Excluir')+'</button></div>';return h}
function apagar(b){if(pend!==b){pend=b;render();return}pend=null;
 D.animais=D.animais.filter(function(a){return a.b!==b});D.leite=D.leite.filter(function(x){return x.b!==b});save();sel=null;render()}
function pAnimais(){if(edit)return form(edit);if(sel)return detalhe(sel);
 var q=(window._q||'').toLowerCase();var l=D.animais.filter(function(a){return !q||(a.b+' '+a.nome).toLowerCase().indexOf(q)>=0});
 var h=form()+'<h2>Rebanho ('+D.animais.length+')</h2><input placeholder="Buscar brinco ou nome" value="'+esc(window._q||'')+'" oninput="window._q=this.value;lista()">'+'<div class="card" id="lista"></div>';
 setTimeout(lista,0);return h}
function lista(){var q=(window._q||'').toLowerCase(),el=document.getElementById('lista');if(!el)return;
 var l=D.animais.filter(function(a){return !q||(a.b+' '+(a.nome||'')).toLowerCase().indexOf(q)>=0});
 el.innerHTML=l.length?l.map(function(a){return '<div class="it" data-b="'+esc(a.b)+'"><div class="'+a.sexo+'">'+lbl(a.b)+'<div class="mut">'+(a.sexo==='F'?'Fêmea':'Macho')+(a.mae?' · mãe '+esc(a.mae):'')+(a.pai?' · pai '+esc(a.pai):'')+'</div></div><span class="mut">Ver</span></div>'}).join(''):'<div class="empty">Nenhum animal ainda. Cadastre o primeiro acima.</div>';
 Array.prototype.forEach.call(el.querySelectorAll('.it'),function(n){n.onclick=function(){sel=n.getAttribute('data-b');render();window.scrollTo(0,0)}})}
function pLeite(){var vacas=D.animais.filter(function(a){return a.sexo==='F'});
 var h='<div class="card"><h2 style="margin-top:0">Registrar ordenha</h2>'+
 '<label>Vaca</label><input id="l_b" list="dl_v" autocomplete="off"><datalist id="dl_v">'+opts('F')+'</datalist>'+
 '<div class="row"><div><label>Data</label><input id="l_d" type="date" value="'+hoje()+'"></div><div><label>Litros</label><input id="l_l" type="number" inputmode="decimal" step="0.1" min="0"></div></div>'+
 '<div id="lerr" class="mut" style="color:var(--bad)"></div><button class="btn" onclick="addLeite()">Salvar litros</button></div>';
 var rows=vacas.map(function(a){return {a:a,m:media(a.b),n:D.leite.filter(function(x){return x.b===a.b}).length}}).filter(function(r){return r.n}).sort(function(x,y){return y.m-x.m});
 var tot=D.leite.length?D.leite.reduce(function(s,x){return s+x.l},0)/D.leite.length:null;
 h+='<h2>Média por vaca</h2><div class="card sc">'+(rows.length?'<table><tr><th>Vaca</th><th class="n">Registros</th><th class="n">Média</th></tr>'+rows.map(function(r){return '<tr><td>'+lbl(r.a.b)+'</td><td class="n">'+r.n+'</td><td class="n">'+fmt(r.m)+'</td></tr>'}).join('')+'<tr><td><b>Rebanho</b></td><td class="n">'+D.leite.length+'</td><td class="n"><b>'+fmt(tot)+'</b></td></tr></table>':'<div class="empty">Sem registros de leite. Salve a primeira ordenha acima.</div>')+'</div>';
 var rec=D.leite.slice().reverse().slice(0,15);
 h+='<h2>Últimos registros</h2><div class="card">'+(rec.length?rec.map(function(x){var i=D.leite.indexOf(x);return '<div class="it" style="cursor:default"><div>'+lbl(x.b)+' <span class="mut">'+fdate(x.d)+'</span></div><div>'+fmt(x.l)+' <button class="btn bad" style="margin:0 0 0 8px;padding:4px 10px" onclick="delLeite('+i+')">Apagar</button></div></div>'}).join(''):'<div class="empty">Nada por aqui ainda.</div>')+'</div>';return h}
function addLeite(){var b=document.getElementById('l_b').value.trim(),d=document.getElementById('l_d').value,l=parseFloat(String(document.getElementById('l_l').value).replace(',','.')),e=document.getElementById('lerr');
 var a=find(b);if(!a||a.sexo!=='F'){e.textContent='Escolha uma vaca já cadastrada.';return}
 if(isNaN(l)||l<0){e.textContent='Informe os litros.';return}D.leite.push({b:a.b,d:d||hoje(),l:l});save();render()}
function delLeite(i){D.leite.splice(i,1);save();render()}
function pBackup(){return '<div class="card"><h2 style="margin-top:0">Instalar no celular</h2><p class="mut">Android (Chrome): menu ⋮, depois Adicionar à tela inicial. iPhone (Safari): Compartilhar, depois Adicionar à Tela de Início.</p></div><div class="card"><h2 style="margin-top:0">Backup dos dados</h2><p class="mut">Seus dados ficam só neste navegador. Se limpar o histórico ou trocar de celular, eles somem. Copie o texto abaixo e guarde nas suas notas ou no WhatsApp.</p>'+
 '<textarea id="bk" rows="7">'+esc(JSON.stringify(D))+'</textarea><button class="btn" onclick="copiar()">Copiar backup</button> <button class="btn alt" onclick="restaurar()">Restaurar deste texto</button><div id="bmsg" class="mut"></div></div>'}
function copiar(){var t=document.getElementById('bk');t.select();try{document.execCommand('copy');document.getElementById('bmsg').textContent='Copiado.'}catch(e){document.getElementById('bmsg').textContent='Selecione o texto e copie manualmente.'}}
function restaurar(){try{var d=JSON.parse(document.getElementById('bk').value);if(!d.animais||!d.leite)throw 0;D=d;save();render()}catch(e){document.getElementById('bmsg').textContent='Texto inválido. Cole o backup completo.'}}
function render(){nav();var h=tab==='animais'?pAnimais():tab==='leite'?pLeite():pBackup();document.getElementById('app').innerHTML=h;if(tab==='animais')lista()}
render();
try{if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js")}catch(e){}
</script>
</body>
</html>
